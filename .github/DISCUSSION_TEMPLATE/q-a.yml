title: "[문의] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ 작성 전 확인
        - API Key, Secret, 토큰, 고객 개인정보, 실제 주문/회원 정보, 서버/DB 접속 정보는 **절대 게시하지 마세요.**
        - 요청/응답 예시의 민감한 값은 `***`로 마스킹해 주세요.
        - 문의하려는 API 종류를 우측 레이블로 지정해 주세요.
  - type: input
    id: endpoint
    attributes:
      label: API 엔드포인트
      description: 호출한 API 경로와 HTTP 메서드
      placeholder: "예: GET /goods/search"
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: 요청 내용
      description: 요청 파라미터/바디 예시 (민감정보 마스킹 필수)
      render: json
    validations:
      required: false
  - type: textarea
    id: response
    attributes:
      label: 응답 결과 / 오류 메시지
      description: 실제 받은 응답 또는 오류 메시지 (민감정보 마스킹 필수)
      render: json
    validations:
      required: true
  - type: input
    id: occurred-at
    attributes:
      label: 발생 일시
      placeholder: "예: 2026-07-14 10:30 (KST)"
    validations:
      required: false
  - type: textarea
    id: detail
    attributes:
      label: 문의 내용
      description: 기대한 동작과 실제 동작의 차이, 시도해 본 조치 등을 자세히 적어 주세요.
    validations:
      required: true
